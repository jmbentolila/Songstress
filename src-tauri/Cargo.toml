[package]
name = "songstress"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "songstress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Optimize DEPENDENCIES in dev builds (lofty/image decode dominates artwork
# scans) while our own code stays opt-level 0: fast incremental compiles,
# full debuggability, overflow checks intact.
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
walkdir = "2"
notify = "7"
lofty = "0.22"
rayon = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

