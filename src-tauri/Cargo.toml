[package]
name = "songstress"
version = "0.11.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This is only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "songstress_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# line-tables-only debuginfo (2026-08-28, after the 25GB target/ incident):
# full debuginfo made every dev artifact 400MB+ across the GTK/WebKit tree,
# and stale ones accumulated in deps/. This keeps stack traces usable in the
# journal while cutting artifact size ~70-80%.
[profile.dev]
debug = "line-tables-only"

# Optimize DEPENDENCIES in dev builds (lofty/image decode dominates artwork
# scans) while our own code stays opt-level 0: fast incremental compiles,
# full debuggability, overflow checks intact.
[profile.dev.package."*"]
opt-level = 2

# Step 7b release profile (DECIDED 2026-08-25): small, fast binary for the
# RPM. lto=thin + codegen-units=1 for whole-crate optimization without the
# full-LTO build-time hit; strip kills debug symbols (dev builds keep them).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
blake3 = "1"
walkdir = "2"
notify = "7"
lofty = "0.22"
rayon = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures-util = "0.3"
raw-window-handle = "0.6"
wayland-client = { version = "0.31", features = ["system"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"] }

