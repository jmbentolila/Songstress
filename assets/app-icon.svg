<!-- Songstress app icon — the stencil mic. Dark stage lit by the user's
     accent (violet here; the glow is the brand's single accent), stencil
     microphone tilted up-right, grille slits and voice arcs as true
     negative space, sound projecting into the light. Rationale from the
     2026-09-04 icon review: stencil discipline (bold broken geometry,
     gaps as language) after glyph/diorama/profile rounds all read either
     borrowed or clumsy; the composition, not the curves, carries it.
     Master source: `npx tauri icon assets/app-icon.svg`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2534"/><stop offset="1" stop-color="#141220"/>
    </linearGradient>
    <radialGradient id="vib" cx="0.70" cy="0.30" r="0.8">
      <stop offset="0" stop-color="#8f6bf5" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#8f6bf5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="115"/></clipPath>
    <mask id="stencil">
      <rect width="512" height="512" fill="black"/>
      <!-- 0.85 mic scale (2026-09-23): full-bleed tile matched Hatter's size
           but the near-white mic filled it edge to edge and read oversize in
           the dash next to Hatter's aired-out glyphs. The tile stays edge to
           edge; the artwork breathes instead. -->
      <g transform="translate(256 256) scale(0.85) translate(-256 -256)">
      <g transform="translate(252 268) rotate(40) translate(-252 -268)">
        <rect x="192" y="222" width="120" height="180" rx="60" fill="white"/>
        <path d="M 156 312 a 96 96 0 0 0 192 0" fill="none" stroke="white" stroke-width="30" stroke-linecap="round"/>
        <rect x="226" y="404" width="52" height="72" rx="24" fill="white"/>
        <rect x="182" y="258" width="140" height="18" fill="black"/>
        <rect x="182" y="300" width="140" height="18" fill="black"/>
        <path d="M 200 178 A 62 62 0 0 1 304 178" fill="none" stroke="white" stroke-width="26" stroke-linecap="round"/>
        <path d="M 172 122 A 96 96 0 0 1 332 122" fill="none" stroke="white" stroke-width="22" stroke-linecap="round" opacity="0.72"/>
      </g>
      </g>
    </mask>
  </defs>
  <!-- Full-bleed tile (2026-09-23): the Hatter theme on GNOME draws
       full-bleed squircles, and our 86% tile read 6px small in the dash
       next to them. The old 14% margin was KRunner/KDE tuning (full-bleed
       printed over tiled rows there) — GNOME is the daily driver now, so
       the tile goes edge to edge like the theme. If KDE tiling complains
       later, this is the lever. -->
  <rect width="512" height="512" rx="115" fill="url(#stage)"/>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#vib)"/>
    <rect width="512" height="512" fill="#f5f2fb" mask="url(#stencil)"/>
  </g>
  <rect x="1" y="1" width="510" height="510" rx="114" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>
</svg>
